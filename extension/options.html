<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dark Pattern Detector - Settings</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 16px;
      color: #222;
    }
    h2 { font-size: 18px; margin-bottom: 4px; }
    p { font-size: 13px; color: #555; line-height: 1.5; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      font-family: monospace;
      font-size: 13px;
      margin: 12px 0 8px;
    }
    button { padding: 8px 14px; font-size: 13px; cursor: pointer; margin-right: 6px; }
    #status { font-size: 13px; margin-top: 12px; }
  </style>
</head>
<body>
  <h2>🔍 Connect to your dashboard</h2>
  <p>
    Sign in to your dashboard, click "Generate API token", and paste the token here.
    Scans are saved to your account only after you do this.
  </p>
  <input id="token" type="password" placeholder="dpd_..." autocomplete="off">
  <div>
    <button id="save">Save token</button>
    <button id="clear">Remove token</button>
  </div>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
